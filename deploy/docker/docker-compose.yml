# 로컬 개발용 인프라 (ADR 0002)
#
# 사용법 (저장소 루트에서):
#   cp deploy/docker/.env.example deploy/docker/.env   # 최초 1회, 값 수정
#   docker compose -f deploy/docker/docker-compose.yml up -d postgres valkey
#
# .env는 이 파일과 같은 디렉터리(deploy/docker/)에서 읽힌다.
# 필수 값이 비어 있으면 ${VAR:?...} 때문에 Compose가 시작 전에 실패한다.

name: mygame

services:
  postgres:
    image: postgres:19
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (see deploy/docker/.env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see deploy/docker/.env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required (see deploy/docker/.env.example)}
    ports:
      # 루프백에만 바인딩해 같은 네트워크의 다른 기기에서 접근하지 못하게 한다.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ 이미지는 PGDATA가 /var/lib/postgresql/<메이저>/docker 이므로
      # 상위 디렉터리를 마운트한다. (예전처럼 .../data에 마운트하면 데이터가 볼륨 밖에 저장된다)
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # $$는 Compose 치환을 막고 컨테이너 안의 환경 변수를 쓰게 한다.
      # -h 127.0.0.1: 최초 초기화 중 임시 서버는 유닉스 소켓으로만 받으므로(listen_addresses=''),
      # 소켓으로 확인하면 진짜 서버가 TCP로 뜨기 전에 healthy가 될 수 있다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.2
    # command는 지정하지 않는다. 이미지 기본값(valkey-server)이어야 docker-entrypoint.sh가
    # valkey 사용자로 권한을 낮춘다(AGENTS.md §8 non-root). `sh -c ...`로 바꾸면 root로 실행된다.
    environment:
      # 관리형 서비스처럼 로컬에서도 인증을 요구해 연결 코드가 환경마다 갈라지지 않게 한다.
      # 진입 스크립트가 마지막 `exec valkey-server ... $VALKEY_EXTRA_FLAGS`에만 붙이므로,
      # command 인자로 넘길 때와 달리 PID 1(tini)의 명령줄(/proc/1/cmdline, ps)에 비밀번호가 남지 않는다.
      # 따옴표 없이 펼쳐지므로 비밀번호에 공백이나 글롭 문자(* ? [)를 쓰면 안 된다.
      VALKEY_EXTRA_FLAGS: "--requirepass ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required (see deploy/docker/.env.example)}"
      # valkey-cli(헬스체크)가 이 변수를 비밀번호로 사용한다. -a 인자를 쓰면 경고가 출력되기 때문이다.
      # 환경 변수는 `docker inspect`로 볼 수 있으므로 비밀번호를 숨기는 장치는 아니다(로컬 전용 구성).
      VALKEYCLI_AUTH: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required (see deploy/docker/.env.example)}
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  valkey-data:
