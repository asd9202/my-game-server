syntax = "proto3";

package mygame.debug.v1;

option csharp_namespace = "MyGame.Protocol.Debug.V1";

// 서버 연결·직렬화 확인용 에코. 운영 환경에서는 엔드포인트를 노출하지 않는다.
message EchoRequest {
  string message = 1;
  // 왕복 시간(RTT) 측정을 위해 클라이언트가 보낸 시각을 그대로 돌려준다.
  int64 client_time_unix_ms = 2;
}

message EchoResponse {
  string message = 1;
  int64 client_time_unix_ms = 2;
  int64 server_time_unix_ms = 3;
}
